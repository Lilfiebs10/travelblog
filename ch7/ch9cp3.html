<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Register</title>
        <link rel="stylesheet" href="ch9.css">
    </head>
    <body>
        <h1>Create your account</h1>
        <form class="panel" action="https://formspree.io/f/xppponje" method="post">
            <input type="hidden" name="_subject" value="New registration!">
            <p> 
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" accesskey="e" tabindex="2" required>
            </p>
            <p>
                <label for="comments">Comments:</label>
                <br>
                <textarea id="comments" name="comments" rows="5" cols="40" tabindex="3"></textarea>
            </p>
            <p class="buttons">
                <input type="submit" value="Submit" tabindex="4">
                
            </p>
        </form>
    </body>
</html>
